<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Render stage</title>
<!-- render.mjs opens this page once per poster: ?model=&yaw=&pitch=&zoom=&explode=&fit=&axis=&ground=&w=&h= builds one
     viewer at exactly that size, and the script copies its first frame. -->
<style>html, body { margin: 0; background: transparent; } .stage { position: relative; } canvas { display: block; }</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<script>
  const q = new URLSearchParams(location.search);
  const fig = document.createElement('figure');
  fig.className = 'viewer';
  fig.style.margin = '0';
  for (const k of ['model', 'yaw', 'pitch', 'zoom', 'explode', 'fit', 'axis', 'ground']) if (q.get(k)) fig.dataset[k] = q.get(k);
  fig.dataset.still = '';
  fig.innerHTML = `<div class="stage" style="width:${q.get('w')}px;height:${q.get('h')}px"></div>`;
  document.body.append(fig);
</script>
<script type="module" src="/assets/viewer.js"></script>
</body>
</html>
