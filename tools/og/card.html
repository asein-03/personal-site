<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Link preview card</title>
<!-- The 1200 x 630 card that link previews show (og.png at the site root). render.mjs drops the live halftone
     plate into #plate and photographs this page. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wdth,wght@75..112.5,300..500&family=Newsreader:opsz,wght@6..72,300..600&family=Archivo:wdth,wght@62..125,500..900&display=block">
<style>
  :root { --bg: #000; --fg: #f5f5f5; --dim: #a8a8a8; --line: rgba(245, 245, 245, .22); --signal: #fcee0a; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--bg); color: var(--fg); }
  body { display: flex; flex-direction: column; padding: 46px 56px 44px; font-family: "Newsreader", Georgia, serif; }
  .mono { font: 400 13px/1 "Martian Mono", ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; }
  .topline { display: flex; justify-content: space-between; padding: 11px 0 10px; border-top: 2px solid var(--fg); border-bottom: 1px solid var(--fg); }
  .grid { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 452px; column-gap: 44px; padding-top: 30px; }
  .story { display: flex; flex-direction: column; }
  .nameplate { font: 800 112px/.86 "Archivo", sans-serif; font-stretch: 72%; letter-spacing: -.01em; text-transform: uppercase; white-space: nowrap; }
  .motto { margin-top: 14px; font-size: 24px; line-height: 1.3; color: var(--dim); }
  .headline { margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--line); font: 800 50px/.98 "Archivo", sans-serif; font-stretch: 72%; text-transform: uppercase; text-wrap: balance; }
  .seeking { display: flex; align-items: center; gap: 14px; margin-top: auto; color: var(--dim); font-size: 12px; white-space: nowrap; }
  .seeking b { padding: 7px 9px 6px; background: var(--signal); color: #000; font-weight: 500; }
  figure { display: flex; flex-direction: column; }
  .plate { position: relative; flex: 1; border: 1px solid var(--fg); overflow: hidden; }
  .plate img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transform: scale(1.4); }
  figcaption { margin-top: 10px; color: var(--dim); font-size: 11px; line-height: 1.4; white-space: nowrap; }
</style>
</head>
<body>
  <div class="topline mono"><span>Vol. I, No. 3</span><span>Charlottesville, Va.</span><span>albertsein.com</span></div>
  <div class="grid">
    <div class="story">
      <h1 class="nameplate">Albert Sein</h1>
      <p class="motto">All the things I've built, and the things I love.</p>
      <p class="headline">A product person who loves building things, and loves working with people even more</p>
      <p class="seeking mono"><b>Looking for</b>Summer 2027 internships, new-grad roles</p>
    </div>
    <figure>
      <div class="plate"><img id="plate" alt=""></div>
      <figcaption class="mono">Aperture&rsquo;s case, printed from the CAD</figcaption>
    </figure>
  </div>
</body>
</html>
